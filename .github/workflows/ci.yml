name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bastion_test
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

      - name: Unit tests
        run: dotnet test tests/Bastion.Domain.Tests/Bastion.Domain.Tests.csproj --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Application tests
        run: dotnet test tests/Bastion.Application.Tests/Bastion.Application.Tests.csproj --no-build -c Release

      - name: Integration tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=bastion_test;Username=bastion;Password=bastion_test"
        run: dotnet test tests/Bastion.Api.IntegrationTests/Bastion.Api.IntegrationTests.csproj --no-build -c Release

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration production

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/Bastion.Api/Dockerfile -t bastion-api:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t bastion-frontend:${{ github.sha }} frontend/
